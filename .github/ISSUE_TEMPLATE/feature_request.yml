name: Feature Request
description: Suggest a new diagnostic rule, code fix, or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea for a new rule or improvement? We'd love to hear it!

  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - New diagnostic rule
        - New code fix / refactoring
        - Improvement to existing rule
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example Code
      description: If applicable, show code that would trigger the proposed diagnostic or benefit from the improvement.
      render: csharp
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any workarounds or alternative approaches?
    validations:
      required: false
