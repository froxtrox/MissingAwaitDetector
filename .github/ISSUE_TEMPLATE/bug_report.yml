name: Bug Report
description: Report a false positive, false negative, or unexpected analyzer behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so we can reproduce and fix it.

  - type: dropdown
    id: diagnostic
    attributes:
      label: Diagnostic Rule
      description: Which rule is affected?
      options:
        - MAWT001 - Task used as value
        - MAWT002 - Synchronous blocking (.Result/.Wait())
        - MAWT003 - Task state polling
        - MAWT004 - Fire-and-forget (discarded Task)
        - MAWT005 - Unawaited stored Task
        - MAWT006 - ValueTask misuse
        - MAWT007 - Unawaited LINQ projection
        - MAWT008 - Blocking in async method
        - MAWT009 - Task stored and poked
        - MAWT010 - async void
        - Other / Multiple
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Issue Type
      options:
        - False positive (diagnostic fires when it shouldn't)
        - False negative (diagnostic doesn't fire when it should)
        - Incorrect code fix
        - Crash / exception
        - Other
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Code to Reproduce
      description: Minimal C# code that demonstrates the issue.
      render: csharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Package Version
      description: Which version of MissingAwaitDetector.Analyzers?
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: dotnet-version
    attributes:
      label: .NET Version
      placeholder: e.g. .NET 8.0, .NET Framework 4.7.2
    validations:
      required: false
